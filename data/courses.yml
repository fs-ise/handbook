courses:
  ABD:
    title: Analytics and Big Data
    description: Explore scalable data analysis, statistical reasoning, and practical methods for turning large datasets into useful evidence and decisions.
  MLBD:
    title: Machine Learning for Big Data
    description: Develop and evaluate machine-learning workflows designed for large, complex datasets using robust, scalable, and reproducible techniques.
  ITP:
    title: Introduction to Programming
    description: Learn foundational programming concepts and structured problem solving through hands-on exercises, examples, and progressively challenging projects.
    aliases: [Prog]
  ITSEC:
    title: IT Security Management
    description: Examine how organizations identify, assess, and manage information-security risks through governance, controls, and informed decision making.
    aliases: [ITSecM]
  IDW:
    title: Introduction to Digital Work
    description: Understand how digital technologies reshape work, collaboration, and organizations while building skills for thoughtful analysis and design.
    image: assets/images/digital-work-lab.png
  OSP:
    title: Open Source Project
    description: Collaborate on a real open-source project while practicing software development, project coordination, documentation, and community participation.
  LRS:
    title: Literature Review Seminar
    description: Plan, conduct, and communicate a rigorous literature review that synthesizes research and develops a well-supported scholarly argument.
    aliases: [LRSem, LRSemHWR, LRSemIDIS]
  EWI:
    title: Einführung in die Wirtschaftsinformatik
    description: Discover the foundations of information systems and how organizations combine people, processes, data, and technology to create value.
    aliases: [EidWI]
