[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-ise-handbook"
version = "0.1.0"
description = "Utilities for building and synchronizing the FS ISE handbook."
requires-python = ">=3.11"
dependencies = [
  "icalendar",
  "python-dateutil",
  "pyyaml",
]
